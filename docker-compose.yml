services:
  fdroid:
    image: austozi/fdroidserver:latest
    container_name: fdroid_server
    restart: unless-stopped
    # user: "1000:1000"
    environment:
      TZ: Asia/Bangkok
      FDROID_UPDATE_INTERVAL: 6h
    volumes:
      - ./fdroid:/fdroid
      - ./updates:/updates:ro
    expose:
      - 8080
    networks:
      - frontend
  nginx:
    image: nginx:alpine
    container_name: fdroid_nginx
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - fdroid
    networks:
      - frontend
networks:
  frontend:
    name: fdriod_net
